name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor is Node 22.12: vitest 5 (and therefore rolldown) requires
        # `^22.12.0 || ^24.0.0 || >=26.0.0`, so 18 and 20 cannot run the suite
        # at all. 18 and 20 are both EOL anyway.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
